<div class="modal-backdrop" (click)="onBackdropClick($event)">
  <div class="modal-content">
    <div class="modal-header">
      <h3>{{ title }}</h3>
      <button class="modal-close" (click)="closed.emit()" aria-label="Fechar">✕</button>
    </div>
    <div class="modal-body">
      <ng-content />
    </div>
  </div>
</div>
